name: Keep Alive Ping

on:
  schedule:
    # Runs every 3 days at midnight (UTC)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to trigger it manually from GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Backend Health Endpoint
        run: |
          curl -f https://bankole-backend.onrender.com/health || exit 1