paths:
  /api/v1/projects/{id}/documents:
    get:
      summary: List project documents
      tags: [Documents]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: perPage
          schema:
            type: integer
      responses:
        '200':
          description: A list of documents
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Project not found
    post:
      summary: Upload a project document
      tags: [Documents]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - kind
                - file
              properties:
                name:
                  type: string
                  minLength: 1
                kind:
                  type: string
                  enum: [contract, invoice, receipt, other]
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document uploaded
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Project not found
  /api/v1/documents/{id}:
    delete:
      summary: Delete document
      tags: [Documents]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Document deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
