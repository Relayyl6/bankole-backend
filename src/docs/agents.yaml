  /api/v1/agents/{id}/portfolio:
    post:
      summary: Add portfolio item
      tags:
        - Agents
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - location
              properties:
                title:
                  type: string
                  minLength: 2
                location:
                  type: string
                assetType:
                  type: string
                summary:
                  type: string
                imageUrl:
                  type: string
                coverUrl:
                  type: string
                completionYear:
                  type: string
      responses:
        '201':
          description: Portfolio item added
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  title:
                    type: string
                  location:
                    type: string
                  assetType:
