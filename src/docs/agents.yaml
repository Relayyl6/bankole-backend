  /api/v1/agents/{id}/credentials:
    post:
      summary: Add credential
      tags:
        - Agents
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                licenseType:
                  type: string
                licenseNumber:
                  type: string
                issuer:
                  type: string
                yearIssued:
                  type: integer
                verifiedOn:
                  type: string
      responses:
        '201':
          description: Credential added
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  licenseType:
                    type: string
                  licenseNumber:
                    type: string
                  label:
                    type: string
                  issuer:
                    type: string
                  verifiedOn:
                    type: string
                    format: date-time
                    nullable: true
                  verified:
                    type: boolean
        '400':
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
