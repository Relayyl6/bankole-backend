paths:
  /api/v1/agents:
    get:
      summary: List agents
      tags:
        - Agents
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: perPage
          schema:
            type: integer
        - in: query
          name: location
          schema:
            type: string
        - in: query
          name: verifiedOnly
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - rating
              - experience
              - projects
        - in: query
          name: minRating
          schema:
            type: number
            minimum: 0
            maximum: 5
        - in: query
          name: specialty
          schema:
            type: array
            items:
              type: string
        - in: query
          name: q
          schema:
            type: string
      responses:
        '200':
          description: Agents retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    type: object
        '400':
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '401':
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '403':
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '404':
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
        '500':
          description: Error response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
  /api/v1/agents/{id}:
    get:
      summary: Get agent profile
      tags:
        - Agents
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent profile retrieved
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Error response
          content:
            application/json:
              schema:
