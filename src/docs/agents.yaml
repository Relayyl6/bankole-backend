  /api/v1/agents/{id}/verification-docs:
    post:
      summary: Upload verification docs
      tags:
        - Agents
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - idDocument
              properties:
                idDocument:
                  type: string
                  format: binary
                credentials:
                  type: string
                  format: binary
                reference:
                  type: string
                  format: binary
                statement:
                  type: string
      responses:
        '200':
          description: Verification docs uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: string
        '400':
