paths:
  /api/v1/milestones/{id}/fund:
    post:
      summary: Fund milestone from wallet
      tags: [Milestones]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Milestone funded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  projectId: { type: string }
                  title: { type: string }
                  description: { type: string }
                  escrowAmount: { type: integer }
                  status: { type: string }
                  dueDate: { type: string }
                  createdAt: { type: string }
  /api/v1/milestones/{id}/submit:
    post:
      summary: Submit milestone for review
      tags: [Milestones]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Milestone submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  projectId: { type: string }
                  title: { type: string }
                  description: { type: string }
                  escrowAmount: { type: integer }
                  status: { type: string }
                  dueDate: { type: string }
                  createdAt: { type: string }
  /api/v1/milestones/{id}/approve:
    post:
      summary: Approve milestone
      tags: [Milestones]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Milestone approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  projectId: { type: string }
                  title: { type: string }
                  description: { type: string }
                  escrowAmount: { type: integer }
                  status: { type: string }
                  dueDate: { type: string }
                  createdAt: { type: string }
  /api/v1/milestones/{id}/flag:
    post:
      summary: Flag milestone for dispute
      tags: [Milestones]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10 }
      responses:
        '200':
          description: Milestone flagged
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  projectId: { type: string }
                  title: { type: string }
                  description: { type: string }
                  escrowAmount: { type: integer }
                  status: { type: string }
                  dueDate: { type: string }
                  createdAt: { type: string }
  /api/v1/milestones/{id}/release:
    post:
      summary: Release milestone funds
      tags: [Milestones]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Funds released
          content:
            application/json:
              schema:
                type: object
                properties:
                  milestone:
                    type: object
                    properties:
                      id: { type: string }
                      projectId: { type: string }
                      title: { type: string }
                      description: { type: string }
                      escrowAmount: { type: integer }
                      status: { type: string }
                      dueDate: { type: string }
                      createdAt: { type: string }
                  fundsReleased: { type: number }
                  fundsInEscrow: { type: number }
  /api/v1/milestones/{id}/proofs:
    post:
      summary: Upload a milestone proof
      tags: [Milestones]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, caption]
              properties:
                file: { type: string, format: binary }
                caption: { type: string, minLength: 1 }
                capturedLat: { type: number }
                capturedLng: { type: number }
                capturedAt: { type: string, format: date-time }
      responses:
        '201':
          description: Proof uploaded and AI verification queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  projectId: { type: string }
                  milestoneId: { type: string }
                  type: { type: string }
                  caption: { type: string }
                  fileUrl: { type: string }
                  thumbnailUrl: { type: string }
                  capturedAt: { type: string, format: date-time }
                  uploadedAt: { type: string, format: date-time }
                  geo:
                    type: object
                    properties:
                      lat: { type: number }
                      lng: { type: number }
                  verification: { type: object }
                  status: { type: string }
