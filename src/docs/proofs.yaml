paths:
  /api/v1/proofs/{id}/verification:
    get:
      summary: Get AI verification result
      tags: [Proofs]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  verdict: { type: string }
                  confidence: { type: number }
                  reasoning: { type: string }
                  metadata: { type: object }
  /api/v1/proofs/{id}/approve:
    post:
      summary: Approve proof
      tags: [Proofs]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: Proof approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
  /api/v1/proofs/{id}/flag:
    post:
      summary: Flag proof
      tags: [Proofs]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10 }
      responses:
        '200':
          description: Proof flagged
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
