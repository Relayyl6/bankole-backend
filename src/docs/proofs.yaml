paths:
  /api/v1/proofs/{id}/verification:
    get:
      summary: Get AI verification result
      tags: [Proofs]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  projectId: { type: string }
                  milestoneId: { type: string }
                  type: { type: string }
                  caption: { type: string }
                  fileUrl: { type: string }
                  thumbnailUrl: { type: string }
                  capturedAt: { type: string, format: date-time }
                  uploadedAt: { type: string, format: date-time }
                  geo:
                    type: object
                    properties:
                      lat: { type: number }
                      lng: { type: number }
                  verification:
                    type: object
                    properties:
                      riskLevel: { type: string }
                      verdict: { type: string }
                      confidence: { type: number }
                      summary: { type: string }
                      checks: { type: array }
                      flags: { type: array }
                  status: { type: string }
  /api/v1/proofs/{id}/approve:
    post:
      summary: Approve proof
      tags: [Proofs]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proof approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  projectId: { type: string }
                  milestoneId: { type: string }
                  type: { type: string }
                  caption: { type: string }
                  fileUrl: { type: string }
                  thumbnailUrl: { type: string }
                  capturedAt: { type: string, format: date-time }
                  uploadedAt: { type: string, format: date-time }
                  geo:
                    type: object
                    properties:
                      lat: { type: number }
                      lng: { type: number }
                  verification:
                    type: object
                    properties:
                      riskLevel: { type: string }
                      verdict: { type: string }
                      confidence: { type: number }
                      summary: { type: string }
                      checks: { type: array }
                      flags: { type: array }
                  status: { type: string }
  /api/v1/proofs/{id}/flag:
    post:
      summary: Flag proof
      tags: [Proofs]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proof flagged
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  projectId: { type: string }
                  milestoneId: { type: string }
                  type: { type: string }
                  caption: { type: string }
                  fileUrl: { type: string }
                  thumbnailUrl: { type: string }
                  capturedAt: { type: string, format: date-time }
                  uploadedAt: { type: string, format: date-time }
                  geo:
                    type: object
                    properties:
                      lat: { type: number }
                      lng: { type: number }
                  verification:
                    type: object
                    properties:
                      riskLevel: { type: string }
                      verdict: { type: string }
                      confidence: { type: number }
                      summary: { type: string }
                      checks: { type: array }
                      flags: { type: array }
                  status: { type: string }
