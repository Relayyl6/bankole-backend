paths:
  /api/v1/payments/cards:
    get:
      summary: Get user cards
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Cards retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        type: { type: string }
                        last4: { type: string }
                        expiry: { type: string }
                        holder: { type: string }
                        isDefault: { type: boolean }
    post:
      summary: Add a new card
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardNumber, expiry, cvv, holder]
              properties:
                cardNumber: { type: string, minLength: 13, maxLength: 19 }
                expiry: { type: string, pattern: '^\d{2}/\d{2}$' }
                cvv: { type: string, minLength: 3, maxLength: 4 }
                holder: { type: string, minLength: 2 }
      responses:
        '201':
          description: Card added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  type: { type: string }
                  last4: { type: string }
                  expiry: { type: string }
                  holder: { type: string }
                  isDefault: { type: boolean }
  /api/v1/payments/cards/{id}:
    delete:
      summary: Delete a card
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Card deleted
  /api/v1/payments/cards/{id}/default:
    post:
      summary: Set card as default
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Default card set
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  isDefault: { type: boolean }
  /api/v1/payments/bank-accounts:
    get:
      summary: Get bank accounts
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Bank accounts retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        bankCode: { type: string }
                        bankName: { type: string }
                        accountNumber: { type: string }
                        accountName: { type: string }
                        isDefault: { type: boolean }
                        createdAt: { type: string, format: date-time }
    post:
      summary: Add bank account
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankCode, accountNumber, accountName]
              properties:
                bankCode: { type: string, minLength: 3, maxLength: 6 }
                accountNumber: { type: string, minLength: 10, maxLength: 10 }
                accountName: { type: string, minLength: 2 }
      responses:
        '201':
          description: Bank account added
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  bankCode: { type: string }
                  bankName: { type: string }
                  accountNumber: { type: string }
                  accountName: { type: string }
                  isDefault: { type: boolean }
                  createdAt: { type: string, format: date-time }
  /api/v1/payments/withdraw:
    post:
      summary: Request withdrawal
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, bankAccountId]
              properties:
                amount: { type: integer, minimum: 1 }
                currency: { type: string, default: NGN }
                bankAccountId: { type: string, format: uuid }
                description: { type: string, default: 'Withdrawal' }
      responses:
        '201':
          description: Withdrawal requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  amount: { type: integer }
                  status: { type: string }
                  bankAccountId: { type: string, format: uuid }
  /api/v1/payments/transactions:
    get:
      summary: Get transaction history
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: perPage
          schema:
            type: integer
      responses:
        '200':
          description: Transactions retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        amount: { type: number }
                        currency: { type: string }
                        type: { type: string }
                        createdAt: { type: string, format: date-time }
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      perPage: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
