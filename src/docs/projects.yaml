paths:
  /api/v1/projects:
    get:
      summary: List projects
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: perPage
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: assetType
          schema:
            type: string
            enum: [real_estate, logistics, generic, borehole, school, land, community]
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: includeMarketplace
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Projects retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object } }
                  meta: { type: object }
    post:
      summary: Create project
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, assetType, location, currency, totalBudget, scope, milestones]
              properties:
                name: { type: string, minLength: 2 }
                assetType: { type: string, enum: [real_estate, logistics, generic, borehole, school, land, community] }
                location:
                  type: object
                  required: [label, lat, lng]
                  properties:
                    label: { type: string, minLength: 1 }
                    lat: { type: number }
                    lng: { type: number }
                agentId: { type: string, minLength: 1, nullable: true }
                currency: { type: string, enum: [NGN] }
                totalBudget: { type: number, minimum: 1 }
                supervisionFeePercentage: { type: number, minimum: 0, maximum: 100, default: 0 }
                scope: { type: string, minLength: 10 }
                fundingMode: { type: string, enum: [upfront, milestone], default: upfront }
                milestones:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      order: { type: integer, minimum: 1 }
                      stage: { type: string, minLength: 1 }
                      escrowAmount: { type: integer, minimum: 1 }
                      dueDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                type: object
  /api/v1/projects/{id}:
    get:
      summary: Get project
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project retrieved
          content:
            application/json:
              schema:
                type: object
    patch:
      summary: Update project
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2 }
                scope: { type: string, minLength: 10 }
                currentStage: { type: string }
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                type: object
  /api/v1/projects/{id}/bids:
    get:
      summary: List project bids
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bids retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object } }
                  meta: { type: object }
    post:
      summary: Submit bid
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposal, bidAmount]
              properties:
                proposal: { type: string, minLength: 5 }
                bidAmount: { type: integer, minimum: 1 }
                proposedDurationWeeks: { type: integer }
      responses:
        '201':
          description: Bid submitted
          content:
            application/json:
              schema:
                type: object
  /api/v1/projects/{id}/bids/{bidId}/accept:
    post:
      summary: Accept bid
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: bidId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bid accepted
          content:
            application/json:
              schema:
                type: object
  /api/v1/projects/{id}/assign-agent:
    post:
      summary: Assign agent
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newAgentId]
              properties:
                newAgentId: { type: string, minLength: 1 }
      responses:
        '200':
          description: Agent assigned
          content:
            application/json:
              schema:
                type: object
  /api/v1/projects/{id}/unassign-agent:
    post:
      summary: Unassign agent
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
                requestDispute: { type: boolean, default: false }
      responses:
        '200':
          description: Agent unassigned
          content:
            application/json:
              schema:
                type: object
  /api/v1/projects/{id}/send-funds:
    post:
      summary: Send funds
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, minimum: 1 }
                currency: { type: string, default: NGN }
                note: { type: string }
      responses:
        '200':
          description: Funds sent
          content:
            application/json:
              schema:
                type: object
  /api/v1/projects/{id}/co-funders:
    post:
      summary: Invite co-funder
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  email: { type: string, format: email }
                  status: { type: string }
                  createdAt: { type: string, format: date-time }
  /api/v1/projects/{id}/milestones:
    get:
      summary: Get milestones
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Milestones retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object } }
    post:
      summary: Create milestone
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, escrowAmount, dueDate]
              properties:
                title: { type: string, minLength: 5, maxLength: 100 }
                description: { type: string, minLength: 10 }
                escrowAmount: { type: integer, minimum: 100 }
                dueDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        '201':
          description: Milestone created
          content:
            application/json:
              schema:
                type: object
  /api/v1/projects/{id}/activity:
    get:
      summary: List activity
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: perPage
          schema:
            type: integer
      responses:
        '200':
          description: Activity retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        projectId: { type: string }
                        type: { type: string }
                        message: { type: string }
                        actor:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            coverLetter: { type: string }
                        createdAt: { type: string, format: date-time }
  /api/v1/projects/{id}/documents:
    get:
      summary: List documents
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: perPage
          schema:
            type: integer
      responses:
        '200':
          description: Documents retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object } }
                  meta: { type: object }
    post:
      summary: Upload document
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name, kind]
              properties:
                file: { type: string, format: binary }
                name: { type: string, minLength: 1 }
                kind: { type: string, enum: [contract, receipt, verification_record, permit, other] }
      responses:
        '201':
          description: Document uploaded
          content:
            application/json:
              schema:
                type: object
  /api/v1/projects/{id}/messages:
    get:
      summary: Get project messages
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: perPage
          schema:
            type: integer
      responses:
        '200':
          description: Messages retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object } }
                  meta: { type: object }
    post:
      summary: Send a project message
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                type: object
