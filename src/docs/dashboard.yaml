paths:
  /api/v1/dashboard/summary:
    get:
      summary: Get dashboard summary metrics
      tags: [Dashboard]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Metrics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency: { type: string }
                  projectCount: { type: integer }
                  totalBudget: { type: number }
                  totalReleased: { type: number }
                  totalInEscrow: { type: number }
                  awaitingYourReview: { type: integer }
                  attentionNeeded: { type: integer }
                  recentActivity:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        projectId: { type: string }
                        type: { type: string }
                        message: { type: string }
                        actor:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            role: { type: string }
                        createdAt: { type: string, format: date-time }
