paths:
  /api/v1/dashboard/summary:
    get:
      summary: Get dashboard summary metrics
      tags: [Dashboard]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Metrics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats: { type: object }
                  activeProjects: { type: array, items: { type: object } }
                  recentTransactions: { type: array, items: { type: object } }
